[project]
description = "Time tracking app"
dependencies = [
    "cheroot==11.1.2",
    "CherryPy==18.10.0",
    "click==8.4.1",
    "Flask==3.1.3",
    "itsdangerous==2.2.0",
    "jaraco.collections==5.2.1",
    "jaraco.context==6.1.2",
    "jaraco.functools==4.5.0",
    "jaraco.text==4.2.0",
    "Jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "MarkupSafe==3.0.3",
    "mdurl==0.1.2",
    "more-itertools==11.1.0",
    "portend==3.2.1",
    "Pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "rich==15.0.0",
    "setuptools==82.0.1",
    "shellingham==1.5.4",
    "six==1.17.0",
    "tempora==5.9.0",
    "typer==0.26.3",
    "typer-slim==0.24.0",
    "Werkzeug==3.1.8",
    "zc.lockfile==4.0",
]

[tool.black]
line-length = 180
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.11"
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.format]
max-line-length = 180

[tool.pylint."extensions.docparams"]
default-docstring-type = "sphinx"
accept-no-param-doc = false
accept-no-return-doc = false

[tool.mypy]
python_version = "3.11"
files = ["main.py", "test"]
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cherrypy"]
ignore_missing_imports = true